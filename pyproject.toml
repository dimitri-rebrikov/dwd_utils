[project]
name = "dwd-utils"
version = "1.0.0"
description = "Utils to read the open data of the DWD (Deutscher Wetterdienst - Germany's National Meteorological Service)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.0",
    "pyproj>=3.0",
    "numpy>=1.20",
    "Pillow>=9.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["testdata", "testdata.*"]

[dependency-groups]
dev = []
